[package]
name = "metadict-api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The web framework
axum = "0.7.5"

# generic http definitions
http = "1.1.0"

# more iterators
itertools = "0.12.1"

# required in order to do source code hot reloading
listenfd = "1.0.1"

# the async runtime
tokio = { version = "1.37.0", features = ["rt-multi-thread"] }

# postgres wrapper for use with tokio
tokio-postgres = "0.7.10"

# async connection pool of tokio-postgres connections
deadpool-postgres = { version = "0.13.0", features = ["serde"] }

# Layered config approach. Set defaults, then override/extend through
# other means. E.g. defaults in file, overriden by env vars.
config = "0.14"

# http specific middleware on top of tower (axum uses tower)
tower-http = { version = "0.5.2", features = ["cors", "trace"] }

# logging for async apps, core library
tracing = "0.1.40"

# a subscriber for tracing
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# SERializing and DEserializing
serde = { version = "1.0.198", features = ["derive"] }

# serializing/deserializing json
serde_json = "1.0.116"

# error wrapper
anyhow = "1.0.82"

# http client
reqwest = { version = "0.12.3", features = ["json"] }

# base64 encoding and decoding
base64 = "0.22.0"

# http cookie parsing and creation
cookie = { version = "0.18.1", features = ["percent-encode"] }

# jwt parsing and creating
jsonwebtoken = "9.3.0"

# simplifies writing custom errors
thiserror = "1.0.59"

# provide #[derive(Builder)]
derive_builder = "0.20.0"

# time and dates
chrono = "0.4.38"
